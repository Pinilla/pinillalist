# Replaces the #PINILLALIST server block in /etc/nginx/conf.d/http.conf once the app is installed.
# The app takes over /, and /prototypes/ keeps serving the static prototype pages.
server {
    listen 443 ssl;
    server_name list.pinillaweb.org;
    ssl_certificate /etc/letsencrypt/live/abs.pinillaweb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abs.pinillaweb.org/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 12m;

    location /prototypes/ {
        root /var/www/pinillalist;
        autoindex on;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
